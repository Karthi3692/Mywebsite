<!DOCTYPE html>
<html>
<head>
    <title>ID Name Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            font-size: 18px;
            width: 200px;
            border-radius: 8px;
            border: 1px solid gray;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-left: 10px;
            border: none;
            border-radius: 8px;
            background-color: green;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        #result {
            margin-top: 30px;
            font-size: 35px;
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Enter Member ID</h1>

    <input type="text" id="memberId" placeholder="Enter ID">
    
    <button onclick="findName()">Show Name</button>

    <div id="result"></div>

    <script>

        // Member IDs and Names
        const members = {
            "101": "Vishali",
            "102": "Tharun",
            "103": "Arun",
            "104": "Priya",
            "105": "Kavin"
        };

        function findName() {

            const id = document.getElementById("memberId").value;

            if (members[id]) {
                document.getElementById("result").innerText =
                    members[id];
            } else {
                document.getElementById("result").innerText =
                    "ID Not Found";
            }
        }

    </script>

</body>
</html>
